services:
  op25:
    # image: is a prebuilt fallback -- `docker compose build`/`up --build`
    # always builds fresh from source and (re)tags it locally as this same
    # name, so local dev is unaffected. A host with no local build (just
    # this compose file + .env, no repo clone) can instead run
    # `docker compose pull && docker compose up -d` to fetch the image
    # published by .github/workflows/publish.yml on every push to master.
    image: ghcr.io/jminnick790/op25:latest
    build:
      context: .
      dockerfile: docker/op25/Dockerfile
    container_name: op25
    restart: unless-stopped
    environment:
      MULTI_RX_DB: /data/op25.db
      LOG_VERBOSITY: ${LOG_VERBOSITY:-1}
      # Only reachable from other compose-network containers (9001 isn't in
      # ports: below) -- lets config-api restart the op25 *process* via
      # supervisord's control interface without any Docker-level access.
      SUPERVISOR_HTTP_PASSWORD: ${SUPERVISOR_HTTP_PASSWORD:-op25supervisor}
    volumes:
      - op25-config-db:/data
    ports:
      # HTTP status/terminal UI - LAN/Tailscale convenience only, not needed
      # for the audio path to reach a browser.
      - "${OP25_HTTP_HOST_PORT:-8080}:8080"
      # Raw PCM WebSocket audio server (op25_audio.cc), used by the New UI's
      # built-in low-latency player when a channel's destination includes a
      # ws:// endpoint. rx.py never binds this port; multi_rx.py does when
      # configured. Harmless to expose either way.
      - "${OP25_WS_AUDIO_HOST_PORT:-8081}:8081"

  config-api:
    image: ghcr.io/jminnick790/op25-config-api:latest
    build:
      context: .
      dockerfile: docker/config-api/Dockerfile
    restart: unless-stopped
    environment:
      OP25_DB_PATH: /data/op25.db
      OP25_HTTP_URL: http://op25:8080/
      OP25_SUPERVISOR_URL: http://op25:${SUPERVISOR_HTTP_PASSWORD:-op25supervisor}@op25:9001/RPC2
    volumes:
      - op25-config-db:/data
    ports:
      - "${CONFIG_API_HOST_PORT:-8091}:8091"
    depends_on:
      - op25

volumes:
  op25-config-db:
