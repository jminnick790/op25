services:
  op25:
    build:
      context: .
      dockerfile: docker/op25/Dockerfile
    container_name: op25   # stable name needed by config-api's docker.sock restart call
    restart: unless-stopped
    environment:
      MULTI_RX_DB: /data/op25.db
      LOG_VERBOSITY: ${LOG_VERBOSITY:-1}
    volumes:
      - op25-config-db:/data
    ports:
      # HTTP status/terminal UI - LAN/Tailscale convenience only, not needed
      # for the audio path to reach a browser.
      - "${OP25_HTTP_HOST_PORT:-8080}:8080"
      # Raw PCM WebSocket audio server (op25_audio.cc), used by the New UI's
      # built-in low-latency player when a channel's destination includes a
      # ws:// endpoint. rx.py never binds this port; multi_rx.py does when
      # configured. Harmless to expose either way.
      - "${OP25_WS_AUDIO_HOST_PORT:-8081}:8081"

  config-api:
    build:
      context: .
      dockerfile: docker/config-api/Dockerfile
    restart: unless-stopped
    environment:
      OP25_DB_PATH: /data/op25.db
      OP25_HTTP_URL: http://op25:8080/
      OP25_CONTAINER_NAME: op25
    volumes:
      - op25-config-db:/data
      # Grants this container root-equivalent control of the Docker host, so
      # it can restart op25 after system/device/channel edits (which always
      # require a restart -- see docker/config/schema.sql). Accepted
      # tradeoff for a home-server deployment; do not expose this service's
      # port to the open internet.
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "${CONFIG_API_HOST_PORT:-8091}:8091"
    depends_on:
      - op25

volumes:
  op25-config-db:
