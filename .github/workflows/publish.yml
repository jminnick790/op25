name: Publish images to GHCR

on:
  push:
    branches: [master]
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Single image now -- config-api was folded into op25 as a second
      # supervisord-managed process (docker/op25/supervisord.conf) rather
      # than staying a separate container/image. See docker/op25/Dockerfile.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/op25/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/op25:latest
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/op25:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
