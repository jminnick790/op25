; Two supervised child processes, split by restart domain:
;   - op25:   multi_rx.py, owns the GNU Radio flowgraph. Restarted whenever
;             topology changes (Set Active, DB import) since the flowgraph
;             can't be reconfigured live -- this is the ONLY thing that
;             restart_op25() (in server/app.py) ever bounces.
;   - server: the SQLite CRUD API + admin UI + New UI static serving + SSE
;             broadcast (formerly the separate config-api container). Never
;             restarted for topology changes, so the browser stays connected
;             (SSE, admin UI/API) through an op25 restart -- the whole point
;             of this split.
;
; server controls op25's lifecycle over this inet_http_server/XML-RPC
; interface -- no /var/run/docker.sock mount, no container-level Docker API
; access needed for that. Loopback-only: both processes are guaranteed
; co-located in this one container, so there's no reason for this control
; channel to ever leave it. The username/password are defense-in-depth on
; top of that, not a real security boundary on their own.

[supervisord]
nodaemon=true
user=root

[inet_http_server]
port=127.0.0.1:9001
username=op25
password=%(ENV_SUPERVISOR_HTTP_PASSWORD)s

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:op25]
command=/usr/local/bin/entrypoint-multi.sh
directory=/op25/op25/gr-op25_repeater/apps
autostart=true
autorestart=true
startsecs=3
stopsignal=TERM
stopwaitsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:server]
command=python3 /usr/local/bin/server/app.py
directory=/usr/local/bin/server
autostart=true
autorestart=true
startsecs=3
stopsignal=TERM
stopwaitsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
