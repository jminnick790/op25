; Runs multi_rx.py as a supervised child process instead of PID 1 directly,
; so config-api can restart *the process* (Set Active, DB import) over the
; compose network's inet_http_server/XML-RPC interface -- no /var/run/docker.sock
; mount, no container-level Docker API access needed for that at all.
;
; This control interface is never published to the host (no `ports:` entry
; in docker-compose.yml) -- only reachable from other containers on the
; compose network. The username/password below are a defense-in-depth
; measure, not a real security boundary on their own.

[supervisord]
nodaemon=true
user=root

[inet_http_server]
port=0.0.0.0:9001
username=op25
password=%(ENV_SUPERVISOR_HTTP_PASSWORD)s

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:op25]
command=/usr/local/bin/entrypoint-multi.sh
directory=/op25/op25/gr-op25_repeater/apps
autostart=true
autorestart=true
startsecs=3
stopsignal=TERM
stopwaitsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
